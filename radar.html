<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>YouTube Radar (프리뷰)</title>
<style>
  /* ---- console.html에서 그대로 복사한 공용 토큰/스타일(원본 무변경, 이 파일에만 붙임) ---- */
  :root{
    --bg:#f6f7f9; --panel:#ffffff; --ink:#1a1d21; --muted:#6b7280; --line:#e5e7eb;
    --accent:#2563eb; --ok:#16a34a; --warn:#d97706; --bad:#dc2626; --chip:#eef2ff; --shadow:0 1px 2px rgba(0,0,0,.04);
  }
  @media (prefers-color-scheme:dark){:root:not([data-theme=light]){
    --bg:#0f1115; --panel:#171a21; --ink:#e6e8eb; --muted:#9aa1ac; --line:#262b34;
    --accent:#60a5fa; --chip:#1e2636; --shadow:none;
  }}
  :root[data-theme=dark]{
    --bg:#0f1115; --panel:#171a21; --ink:#e6e8eb; --muted:#9aa1ac; --line:#262b34;
    --accent:#60a5fa; --chip:#1e2636; --shadow:none;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);font-size:14px;line-height:1.55;
       font-family:-apple-system,"Segoe UI",Pretendard,sans-serif}
  .wrap{max-width:1100px;margin:0 auto;padding:16px}
  header{display:flex;align-items:center;gap:10px;margin-bottom:12px;flex-wrap:wrap}
  h1{font-size:18px;margin:0}
  .spacer{flex:1}
  .pill{font-size:12px;padding:3px 10px;border-radius:999px;background:var(--chip);color:var(--accent);font-weight:600}
  .pill.ok{background:rgba(22,163,74,.12);color:var(--ok)} .pill.bad{background:rgba(220,38,38,.12);color:var(--bad)}
  button{font:inherit;cursor:pointer;border:1px solid var(--line);background:var(--panel);color:var(--ink);
         border-radius:8px;padding:6px 12px}
  button:hover{border-color:var(--accent)}
  button.primary{background:var(--accent);color:#fff;border-color:var(--accent)}
  button.danger{border-color:var(--bad);color:var(--bad)}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:16px;box-shadow:var(--shadow);margin-bottom:14px}
  .hide{display:none}
  .row{display:flex;gap:10px;flex-wrap:wrap}
  .row>div{flex:1;min-width:160px}
  label{font-size:12px;color:var(--muted);display:block;margin-bottom:4px}
  input,select{font:inherit;padding:7px 9px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink);width:100%}
  .note{font-size:12px;color:var(--muted)}
  a{color:var(--accent)}
  .previewBanner{background:rgba(217,119,6,.15);border:1px solid var(--warn);color:var(--warn);
                  border-radius:10px;padding:8px 14px;font-weight:600;margin-bottom:12px;font-size:13px}

  /* ---- kwcard류(console.html의 유튜브 카드 CSS) 그대로 복사, 클래스명 유지 ---- */
  .kwgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:12px}
  .kwcard{position:relative;border:1px solid var(--line);border-radius:10px;overflow:hidden;display:flex;flex-direction:column;background:var(--panel)}
  .kwcard img{width:100%;aspect-ratio:16/9;object-fit:cover;display:block;background:#0002}
  .kwbody{padding:8px 10px;display:flex;flex-direction:column;gap:5px}
  .kwtitle{font-size:13px;line-height:1.35;font-weight:600;color:inherit;text-decoration:none;
           display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
  .kwtitle:hover{text-decoration:underline}
  .kwmeta{font-size:11px;color:var(--muted);display:flex;gap:6px;flex-wrap:wrap;align-items:center}
  .kwtag{border:1px solid var(--line);border-radius:4px;padding:1px 5px;font-size:10px}
  .kwscore{position:absolute;top:6px;left:6px;font-size:11px;font-weight:700;padding:2px 7px;
           border-radius:6px;color:#fff;background:rgba(37,99,235,.92);z-index:2}

  /* ---- 이번 파일 전용 신규 스타일(상태 배지·제외 안내) ---- */
  .statusbadge{font-size:10px;padding:1px 6px;border-radius:4px;background:#6b728022;color:var(--muted);border:1px solid var(--line)}
  .statusbadge.discovered{background:rgba(37,99,235,.15);color:var(--accent);border-color:var(--accent)}
  .sourcetag{font-size:9px;padding:0 4px;border-radius:3px;font-weight:700}
  .sourcetag.live{background:rgba(22,163,74,.15);color:var(--ok)}
  .sourcetag.dummy{background:rgba(107,114,128,.15);color:var(--muted)}
  .cardbtns{display:flex;gap:6px;margin-top:4px}
  .cardbtns button{flex:1;padding:4px 6px;font-size:12px}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>🛰️ YouTube Radar</h1>
    <span id="statusPill" class="pill">로딩…</span>
    <span class="spacer"></span>
    <button id="refreshBtn" title="새로고침">↻</button>
    <button id="themeBtn" title="테마">◐</button>
  </header>

  <div id="liveBanner" class="previewBanner">조회 전용 — 제작 상태는 DB 기준입니다. SKIP 저장 연결은 아직 구현되지 않았습니다.</div>

  <div id="view"><div class="card muted">불러오는 중…</div></div>
</div>

<script>
// ---- console.html에서 그대로 복사한 공용 유틸(원본 무변경) ----
const $ = s => document.querySelector(s);
const esc = s => (s==null?'':String(s)).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const ago = ts => { if(!ts) return ''; const d=Math.floor((Date.now()/1000)-ts);
  if(d<60)return d+'초 전'; if(d<3600)return Math.floor(d/60)+'분 전'; if(d<86400)return Math.floor(d/3600)+'시간 전'; return Math.floor(d/86400)+'일 전'; };
const dt = ts => ts? new Date(ts*1000).toLocaleString('ko-KR',{month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit'}) : '-';
const nfmt = n => (typeof n==='number') ? n.toLocaleString('ko-KR') : '-';

// 이번 파일 전용: ISO8601(우리 스키마) → epoch초(ago/dt가 기대하는 형식)로 변환
function isoToEpoch(iso){ if(!iso) return null; const t=Date.parse(iso); return isNaN(t)?null:Math.floor(t/1000); }

const LS = { theme:'con_theme' }; // 테마만 저장하며 인증정보·제외 상태는 읽지 않는다.
function applyTheme(t){ if(t) document.documentElement.setAttribute('data-theme',t); else document.documentElement.removeAttribute('data-theme'); }
applyTheme(localStorage.getItem(LS.theme));
$('#themeBtn').onclick=()=>{
  const cur=document.documentElement.getAttribute('data-theme');
  const next = cur==='dark' ? 'light' : (cur==='light' ? '' : 'dark');
  applyTheme(next); if(next) localStorage.setItem(LS.theme,next); else localStorage.removeItem(LS.theme);
};
$('#refreshBtn').onclick=()=>loadAll();

// ---- 데이터 로드: videos.json만(keywords.json 참조 안 함) ----
let videos = [];
async function loadAll(){
  try{
    const r = await fetch('./data/videos.json?_='+Date.now());
    videos = r.ok ? await r.json() : [];
    $('#statusPill').textContent = `${videos.length}건`;
    $('#statusPill').className='pill ok';
  }catch(e){
    $('#statusPill').textContent='로드 실패'; $('#statusPill').className='pill bad';
  }
  render();
}

const STATUS_LABEL = {DISCOVERED:'발견함', REVIEWED:'분석함', PLANNED:'대본화함',
  PRODUCED:'제작함', PUBLISHED:'발행함', SKIPPED:'참고 안 함'};

function statusBadge(s){
  const cls = s==='DISCOVERED' ? 'statusbadge discovered' : 'statusbadge';
  return `<span class="${cls}">${esc(STATUS_LABEL[s]||s||'-')}</span>`;
}

function card(v){
  const thumb = `https://i.ytimg.com/vi/${encodeURIComponent(v.video_id)}/mqdefault.jpg`;
  const url = `https://www.youtube.com/watch?v=${encodeURIComponent(v.video_id)}`;
  const epoch = isoToEpoch(v.published_at);
  const src = v.source || 'dummy';
  return `<div class="kwcard" data-vid="${esc(v.video_id)}">
    <span class="kwscore" title="trend_score_breakdown: ${esc(JSON.stringify(v.trend_score_breakdown||{}))}">${v.trend_score}</span>
    <a href="${url}" target="_blank" rel="noopener"><img src="${thumb}" alt="" loading="lazy" onerror="this.style.opacity=0.15"></a>
    <div class="kwbody">
      <a class="kwtitle" href="${url}" target="_blank" rel="noopener">${esc(v.title)}</a>
      <div class="kwmeta">
        <span>${esc(v.channel_title||'')}</span><span>·</span>
        <span class="mono">조회 ${nfmt(v.view_count)}</span>
      </div>
      <div class="kwmeta">
        <span>👍 ${v.like_count==null?'—':nfmt(v.like_count)}</span>
        <span>💬 ${v.comment_count==null?'—':nfmt(v.comment_count)}</span>
        <span>${epoch?ago(epoch):'-'}</span>
      </div>
      <div class="kwmeta">
        ${v.sport?`<span class="kwtag">${esc(v.sport)}</span>`:'<span class="kwtag">미분류</span>'}
        ${v.league?`<span class="kwtag">${esc(v.league)}</span>`:''}
        ${v.region?`<span class="kwtag">${esc(v.region)}</span>`:''}
        ${statusBadge(v.status)}
        <span class="sourcetag ${src}">${src.toUpperCase()}</span>
      </div>
      <div class="cardbtns">
        <button disabled title="DB 함수만 구현됨. 화면 저장 연결은 별도 승인 필요">SKIP (DB 연결 대기)</button>
      </div>
    </div>
  </div>`;
}

function render(){
  const shown = videos.filter(v => v.status !== 'SKIPPED');
  const view = $('#view');
  if(!shown.length){ view.innerHTML = '<div class="card muted">표시할 후보가 없습니다.</div>'; return; }
  view.innerHTML = `<div class="card"><div class="note" style="margin-bottom:8px">
      총 ${videos.length}건 중 ${shown.length}건 표시(DB 제외 상태 숨김)</div>
    <div class="kwgrid">${shown.map(card).join('')}</div></div>`;

}

loadAll();
</script>
</body>
</html>
