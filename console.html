<title>운영 콘솔</title>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  :root{
    --bg:#f6f7f9; --panel:#ffffff; --ink:#1a1d21; --muted:#6b7280; --line:#e5e7eb;
    --accent:#2563eb; --ok:#16a34a; --warn:#d97706; --bad:#dc2626; --chip:#eef2ff;
    --shadow:0 1px 2px rgba(0,0,0,.04),0 1px 3px rgba(0,0,0,.06);
    font-family:'Inter',system-ui,-apple-system,'Segoe UI','Malgun Gothic',sans-serif;
  }
  :root:not([data-theme=light]) @media (prefers-color-scheme:dark){}
  @media (prefers-color-scheme:dark){:root:not([data-theme=light]){
    --bg:#0f1115; --panel:#171a21; --ink:#e6e8eb; --muted:#9aa1ac; --line:#262b34;
    --accent:#60a5fa; --chip:#1e2636; --shadow:none;
  }}
  :root[data-theme=dark]{
    --bg:#0f1115; --panel:#171a21; --ink:#e6e8eb; --muted:#9aa1ac; --line:#262b34;
    --accent:#60a5fa; --chip:#1e2636; --shadow:none;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);font-size:14px;line-height:1.55}
  .wrap{max-width:1080px;margin:0 auto;padding:18px 16px 60px}
  header{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:14px}
  h1{font-size:19px;margin:0;font-weight:700}
  .pill{font-size:12px;padding:3px 10px;border-radius:999px;background:var(--chip);color:var(--accent);font-weight:600}
  .pill.ok{background:rgba(22,163,74,.12);color:var(--ok)} .pill.bad{background:rgba(220,38,38,.12);color:var(--bad)}
  .pill.run{background:rgba(217,119,6,.12);color:var(--warn)}
  .spacer{flex:1}
  button{font:inherit;cursor:pointer;border:1px solid var(--line);background:var(--panel);color:var(--ink);
    padding:7px 12px;border-radius:8px;transition:.12s}
  button:hover{border-color:var(--accent)}
  button.primary{background:var(--accent);color:#fff;border-color:var(--accent)}
  button.danger{border-color:var(--bad);color:var(--bad)}
  button:disabled{opacity:.45;cursor:not-allowed}
  .tabs{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0 16px;border-bottom:1px solid var(--line);padding-bottom:0}
  .tab{border:none;border-bottom:2px solid transparent;border-radius:0;padding:8px 10px;color:var(--muted);background:none}
  .tab.active{color:var(--accent);border-bottom-color:var(--accent);font-weight:600}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:16px;box-shadow:var(--shadow);margin-bottom:14px}
  .grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:12px}
  .kpi{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px}
  .kpi .n{font-size:24px;font-weight:700} .kpi .l{font-size:12px;color:var(--muted);margin-top:2px}
  table{width:100%;border-collapse:collapse;font-size:13px}
  th,td{text-align:left;padding:8px 10px;border-bottom:1px solid var(--line);vertical-align:top}
  th{color:var(--muted);font-weight:600;font-size:12px}
  .tag{display:inline-block;font-size:11px;background:var(--chip);color:var(--accent);padding:1px 7px;border-radius:6px;margin:1px 3px 1px 0}
  .muted{color:var(--muted)} .mono{font-variant-numeric:tabular-nums}
  .item h3{margin:0 0 4px;font-size:15px} .item{padding:12px 0;border-bottom:1px solid var(--line)}
  .item:last-child{border:none}
  .scroll{overflow-x:auto}
  input,select{font:inherit;padding:7px 9px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink);width:100%}
  label{font-size:12px;color:var(--muted);display:block;margin:10px 0 4px}
  .row{display:flex;gap:10px;flex-wrap:wrap}
  .row>div{flex:1;min-width:180px}
  .note{font-size:12px;color:var(--muted);margin-top:6px}
  .modal{position:fixed;inset:0;background:rgba(0,0,0,.5);display:none;align-items:center;justify-content:center;padding:16px;z-index:9}
  .modal.on{display:flex}
  .modal .card{max-width:420px;width:100%;margin:0}
  .cmdlog{font-size:12px} .badge{font-size:11px;padding:1px 7px;border-radius:6px}
  .badge.done{background:rgba(22,163,74,.12);color:var(--ok)} .badge.err{background:rgba(220,38,38,.12);color:var(--bad)}
  .badge.pend{background:rgba(217,119,6,.12);color:var(--warn)}
  a{color:var(--accent)}
  .hide{display:none}
  /* 키워드 수집물 그리드 (2026-08-23) */
  .kwbar{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin:0 0 10px}
  .kwchip{border:1px solid var(--line);border-radius:999px;padding:4px 10px;font-size:12px;
          background:none;color:var(--muted);cursor:pointer}
  .kwchip.on{border-color:var(--accent);color:var(--accent);font-weight:600}
  .kwgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:12px}
  .kwcard{border:1px solid var(--line);border-radius:10px;overflow:hidden;display:flex;flex-direction:column}
  .kwcard img{width:100%;aspect-ratio:16/9;object-fit:cover;display:block;background:#0002}
  .kwbody{padding:8px 10px;display:flex;flex-direction:column;gap:4px}
  .kwtitle{font-size:13px;line-height:1.35;font-weight:600;color:inherit;text-decoration:none;
           display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
  .kwtitle:hover{text-decoration:underline}
  .kwmeta{font-size:11px;color:var(--muted);display:flex;gap:6px;flex-wrap:wrap;align-items:center}
  .kwtag{border:1px solid var(--line);border-radius:4px;padding:1px 5px;font-size:10px}
  .kwsort{display:flex;gap:4px;align-items:center;margin-left:auto}
  .kwsort .kwchip{border-radius:6px}
  .kwnote{font-size:11px;color:var(--muted)}
  .kwscore{position:absolute;top:6px;left:6px;font-size:11px;font-weight:700;padding:2px 7px;
           border-radius:999px;background:rgba(0,0,0,.72);color:#fff;cursor:help}
  .kwscore.cand{background:rgba(22,163,74,.92)}   /* 후보 70+ */
  .kwscore.hold{background:rgba(217,119,6,.92)}   /* 보류 55~69 */
  .kwcard{position:relative}
  /* 승인 체크박스 — 2026-08-29 콘솔 체크박스 승인(단계B), 기존 카드에 추가만 */
  .kwpick{position:absolute;top:6px;right:6px;width:18px;height:18px;z-index:2;cursor:pointer;accent-color:var(--accent)}
  .kwtoolbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:0 0 10px}
  .kwtoolbar .kwcount{font-size:12px;color:var(--muted)}
</style>

<div class="wrap">
  <header>
    <h1>🛰️ 로컬 파이프라인 운영 콘솔</h1>
    <span id="statusPill" class="pill">로딩…</span>
    <span class="spacer"></span>
    <span id="dataAge" class="pill" title="콘솔 데이터가 마지막으로 발행된 시각">데이터 —</span>
    <span id="refreshInfo" class="muted" style="font-size:12px"></span>
    <button id="refreshBtn" title="새로고침">↻</button>
    <button id="themeBtn" title="테마">◐</button>
    <button id="setBtn">⚙ 설정</button>
  </header>

  <!-- 설정 -->
  <div id="settings" class="card hide">
    <b>설정</b> <span class="note">PAT는 이 브라우저의 localStorage에만 저장됩니다. 저장소·HTML에 절대 포함되지 않습니다.</span>
    <div class="row">
      <div><label>저장소 (owner/repo)</label><input id="repo" placeholder="joker8awesome/local-llm-report"></div>
      <div><label>브랜치</label><input id="branch" placeholder="main"></div>
    </div>
    <label>GitHub PAT (Contents: write · 명령 전송용, 선택)</label>
    <input id="pat" type="password" placeholder="github_pat_… (비워두면 조회 전용)">
    <div class="row" style="margin-top:12px">
      <button class="primary" id="saveSet">저장</button>
      <button id="clearPat">PAT 삭제</button>
    </div>
    <div class="note">PAT 없이도 모든 조회(실행이력·오류·수집물·건강)는 동작합니다. PAT는 명령 전송에만 필요합니다.</div>
  </div>

  <nav class="tabs" id="tabs"></nav>
  <div id="view"></div>
</div>

<!-- 확인 모달 -->
<div class="modal" id="modal">
  <div class="card">
    <b id="mTitle">확인</b>
    <p id="mBody" class="note"></p>
    <div class="row" style="margin-top:8px">
      <button class="primary" id="mYes">확인 전송</button>
      <button id="mNo">취소</button>
    </div>
  </div>
</div>

<script>
const $ = s => document.querySelector(s);
const LS = { repo:'con_repo', branch:'con_branch', pat:'con_pat', theme:'con_theme', kwPicked:'con_kwpicked' };
const cfg = {
  repo: localStorage.getItem(LS.repo) || 'joker8awesome/local-llm-report',
  branch: localStorage.getItem(LS.branch) || 'main',
  pat: localStorage.getItem(LS.pat) || '',
};
const DATA = {}; // 캐시된 json
const esc = s => (s==null?'':String(s)).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const ago = ts => { if(!ts) return ''; const d=Math.floor((Date.now()/1000)-ts);
  if(d<60)return d+'초 전'; if(d<3600)return Math.floor(d/60)+'분 전'; if(d<86400)return Math.floor(d/3600)+'시간 전'; return Math.floor(d/86400)+'일 전'; };
const dt = ts => ts? new Date(ts*1000).toLocaleString('ko-KR',{month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit'}) : '-';

// ---- 데이터 로드 ----
async function loadAll(){
  const files=['status','runs','errors','items','health','commands_log','sources','media','issues','yt_analysis','keywords'];
  let okAny=false;
  await Promise.all(files.map(async f=>{
    try{ const r=await fetch('./data/'+f+'.json?_='+Date.now()); if(r.ok){DATA[f]=await r.json();okAny=true;} }
    catch(e){ DATA[f]=DATA[f]||null; }
  }));
  $('#refreshInfo').textContent = '화면 갱신 ' + new Date().toLocaleTimeString('ko-KR');
  paintDataAge();
  paintStatus(okAny);
  render();
}
const STALE_HOURS = 6;        // 이 시간 넘게 발행이 없으면 헤더에 경고(코디 초안 채택)
function paintDataAge(){
  const el=$('#dataAge'); if(!el) return;
  // 발행 시각 = data/*.json 의 generated_at 중 가장 최신
  const cands=['health','sources','items','runs','errors','status'].map(k=>(DATA[k]||{}).generated_at).filter(Boolean);
  if(!cands.length){ el.textContent='데이터 —'; el.className='pill'; return; }
  const ts=Math.max(...cands), ageH=(Date.now()/1000-ts)/3600;
  const when=new Date(ts*1000).toLocaleString('ko-KR',{month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit'});
  el.textContent = (ageH>=STALE_HOURS?'⚠ ':'') + '데이터 ' + when + ' (' +
                   (ageH<1? Math.round(ageH*60)+'분' : ageH.toFixed(1)+'시간') + ' 경과)';
  el.className = 'pill' + (ageH>=STALE_HOURS?' bad':'');
  el.title = ageH>=STALE_HOURS
    ? STALE_HOURS+'시간 이상 발행이 없다 — 파이프라인/발행 경로 점검 필요'
    : '콘솔 데이터 마지막 발행 시각';
}
function paintStatus(okAny){
  const p=$('#statusPill'); const s=DATA.status;
  if(!okAny){ p.className='pill bad'; p.textContent='데이터 없음'; return; }
  if(s&&s.running){ p.className='pill run'; p.textContent='실행 중'; return; }
  const l=s&&s.latest;
  if(l){ p.className='pill '+(l.success?'ok':'bad'); p.textContent=(l.success?'정상':'최근 실패')+' · '+ago(l.started); }
  else { p.className='pill'; p.textContent='대기'; }
}

// ---- 탭 ----
const TABS=[['overview','개요'],['runs','실행이력'],['errors','오류'],['items','수집물'],['health','건강'],['commands','명령']];
let active='overview';
function buildTabs(){
  $('#tabs').innerHTML='';
  TABS.forEach(([k,l])=>{ const b=document.createElement('button'); b.className='tab'+(k===active?' active':'');
    b.textContent=l; b.onclick=()=>{active=k;buildTabs();render();}; $('#tabs').appendChild(b); });
}
function render(){ const v=$('#view'); v.innerHTML = ({
  overview:vOverview, runs:vRuns, errors:vErrors, items:vItems, health:vHealth, commands:vCommands
}[active]||(()=>''))(); if(active==='commands') wireCommands(); if(active==='items') wireKeywords(); }

function vOverview(){
  const s=DATA.status||{}, h=(DATA.health||{}).stats||{}, e=DATA.errors||{}, it=DATA.items||{};
  const l=s.latest;
  return `<div class="grid">
    ${kpi(h.success_rate!=null?h.success_rate+'%':'-','최근 성공률')}
    ${kpi(h.avg_sec!=null?h.avg_sec+'s':'-','평균 소요')}
    ${kpi(e.unresolved!=null?e.unresolved:'-','미해결 오류')}
    ${kpi(it.count!=null?it.count:'-','최근 수집물')}
  </div>
  <div class="card"><b>최근 실행</b>${ l? `
    <table class="mono"><tr><th>실행</th><td>${esc(l.run_id)}</td></tr>
    <tr><th>시각</th><td>${dt(l.started)} (${ago(l.started)})</td></tr>
    <tr><th>결과</th><td>${l.success?'✅ 성공':'❌ 실패'}</td></tr>
    <tr><th>소요</th><td>${l.total_sec}s</td></tr>
    <tr><th>단계</th><td>${Object.entries(l.stages||{}).map(([k,v])=>`${esc(k)} ${v}s`).join(' · ')||'-'}</td></tr></table>`
    : '<p class="muted">기록 없음</p>' }</div>`;
}
function kpi(n,l){return `<div class="kpi"><div class="n">${esc(n)}</div><div class="l">${esc(l)}</div></div>`;}

function vRuns(){
  const rs=(DATA.runs||{}).runs||[];
  if(!rs.length) return '<div class="card muted">실행 이력이 없습니다.</div>';
  return `<div class="card scroll"><table class="mono"><thead><tr>
    <th>시각</th><th>트리거</th><th>결과</th><th>소요</th><th>단계</th></tr></thead><tbody>${
    rs.map(r=>`<tr><td>${dt(r.started)}</td><td>${esc(r.trigger||'-')}</td>
      <td>${r.success?'✅':'❌'}</td><td>${r.total_sec}s</td>
      <td class="muted">${Object.entries(r.stages||{}).map(([k,v])=>esc(k)+' '+v+'s').join(' · ')}</td></tr>`).join('')
    }</tbody></table></div>`;
}
function vErrors(){
  const es=(DATA.errors||{}).errors||[];
  if(!es.length) return '<div class="card ok">현재 보고된 오류가 없습니다. ✅</div>';
  return `<div class="card scroll"><table><thead><tr><th>유형</th><th>단계</th><th>대상</th><th>내용</th><th>상태</th></tr></thead><tbody>${
    es.map(e=>`<tr><td>${esc(e.type)}</td><td>${esc(e.stage)}</td><td>${esc(e.source||'-')}</td>
      <td>${esc(e.message)}</td><td><span class="badge ${e.resolved?'done':'err'}">${e.resolved?'해결':'미해결'}</span></td></tr>`).join('')
    }</tbody></table></div>`;
}
let kwTopic='all';
let kwSort='topic';                 // topic(기본) | views | recent
const nfmt = n => (typeof n==='number') ? n.toLocaleString('ko-KR') : '-';

// ---- 승인 체크(단계B, 2026-08-29) — video_id 기준.
// ★자동 삭제 없음(2026-08-29 지시 정정) — 날짜는 항목별로 동봉하되 지우지 않는다.
//   삭제는 오직 '전체 해제' 버튼(사용자 명시 조작)으로만. 자정 자동초기화였던 첫 구현은 폐기.
// 저장형식: {videoId: 'YYYY-MM-DD'(체크한 날짜), ...} — 오늘이 아니면 카드에 '어제' 배지
let kw12hOnly=true, kwUncheckedOnly=false;   // 12시간 필터 기본 ON(2026-08-29 지시) — CEO가 원하는 게 최신 12시간
function todayStr(){ return new Date().toISOString().slice(0,10); }
function loadPicked(){
  try{ return JSON.parse(localStorage.getItem(LS.kwPicked)||'{}') || {}; }catch(e){ return {}; }
}
let kwPicked = loadPicked();               // {videoId: dateStr} — Set 아님, 날짜 보존 위해 객체
function savePicked(){ localStorage.setItem(LS.kwPicked, JSON.stringify(kwPicked)); }

// 게시일 상대표기("2년 전"·"3개월 전"·"5일 전") → '몇 초 전' 근사값.
// ★근사다. 절대시각을 얻으려면 영상별 상세 호출이 필요한데 차단 위험 대비 이득이 작아 하지 않는다.
//   같은 구간(예: 둘 다 "2년 전")끼리는 순서가 보장되지 않는다.
const REL_UNITS = [['년',31536000],['개월',2592000],['주',604800],['일',86400],['시간',3600],['분',60],['초',1]];
function relAgoSec(txt){
  if(!txt) return null;
  const m = String(txt).match(/(\d+)\s*(년|개월|주|일|시간|분|초)/);
  if(!m) return null;
  const u = REL_UNITS.find(([k])=>k===m[2]);
  return u ? Number(m[1])*u[1] : null;
}
// null 은 언제나 맨 뒤로. 정렬 키를 [null여부, 값] 으로 잡아 안정 정렬한다.
function kwSorted(list){
  const arr = list.map((k,i)=>({k,i}));
  if(kwSort==='views'){
    arr.sort((a,b)=>{
      const av=a.k.view_count, bv=b.k.view_count;
      const an=(av==null)?1:0, bn=(bv==null)?1:0;
      return an-bn || (bv||0)-(av||0) || a.i-b.i;
    });
  } else if(kwSort==='recent'){
    arr.sort((a,b)=>{
      const as=relAgoSec(a.k.published_at), bs=relAgoSec(b.k.published_at);
      const an=(as==null)?1:0, bn=(bs==null)?1:0;
      return an-bn || (as||0)-(bs||0) || a.i-b.i;   // 경과초가 작을수록 최신
    });
  }
  else if(kwSort==='recommend'){
    // 추천 = 발행물의 recommended 목록(produce_target=true · 70점 후보 우선 · 토픽당 최대 3 · 상위 10).
    // 규칙 계산은 파이프라인(keyword_score.py)에서 끝나 있고 화면은 그 결과를 따른다.
    const rec=((DATA.keywords||{}).recommended)||[];
    const rank=new Map(rec.map((r,i)=>[r.video_id,i]));
    return arr.filter(x=>rank.has(x.k.video_id))
              .sort((a,b)=>rank.get(a.k.video_id)-rank.get(b.k.video_id))
              .map(x=>x.k);
  }
  return arr.map(x=>x.k);            // topic = 발행 순서(토픽 정본순→조회수) 그대로
}

// 키워드 토픽 수집물 — data/keywords.json 이 주 소스다(media 0건, refined items 0건).
function vKeywords(){
  const kw=(DATA.keywords||{}).items||[];
  if(!kw.length) return '';
  const counts={}; kw.forEach(k=>{counts[k.topic]=(counts[k.topic]||0)+1;});
  const names={}; kw.forEach(k=>{names[k.topic]=k.topic_name||k.topic;});
  const topics=Object.keys(counts);
  let filtered = kwTopic==='all' ? kw : kw.filter(k=>k.topic===kwTopic);
  if(kw12hOnly) filtered = filtered.filter(k=>{ const s=relAgoSec(k.published_at); return s!=null && s<=43200; });
  if(kwUncheckedOnly) filtered = filtered.filter(k=>!(k.video_id in kwPicked));
  const shown = kwSorted(filtered);     // 토픽 필터 → 정렬 순으로 함께 동작한다
  const chip=(id,label,n)=>`<button class="kwchip${kwTopic===id?' on':''}" data-kw="${esc(id)}">${esc(label)} ${n}</button>`;
  const bar=`<div class="kwbar"><b style="font-size:13px">🔑 키워드 수집물</b>`
    + chip('all','전체',kw.length)
    + topics.map(t=>chip(t,names[t],counts[t])).join('')
    + `<span class="kwsort">
         <button class="kwchip${kwSort==='topic'?' on':''}" data-kwsort="topic" title="토픽 정본순 → 조회수 내림차순(기본)">토픽순</button>
         <button class="kwchip${kwSort==='views'?' on':''}" data-kwsort="views" title="조회수 내림차순. 조회수 없는 항목은 맨 뒤">조회순</button>
         <button class="kwchip${kwSort==='recent'?' on':''}" data-kwsort="recent" title="게시일은 상대표기(&quot;2년 전&quot;) 기준 근사 정렬 — 같은 구간끼리는 순서가 보장되지 않는다">최신순</button>
         <button class="kwchip${kwSort==='recommend'?' on':''}" data-kwsort="recommend" title="소재 선정 기준 v1 점수 상위 10건. 제작대상(야구)만 · 토픽당 최대 3건">추천순</button>
       </span></div>`
    + `<div class="kwbar" style="margin-top:-4px"><span class="kwnote">
         ${kwSort==='recent'?'⚠ 게시일은 상대표기 기준 <b>근사 정렬</b>입니다 — 같은 구간(예: 둘 다 &quot;2년 전&quot;)은 순서가 보장되지 않습니다.'
          :kwSort==='recommend'?('추천 상위 '+(((DATA.keywords||{}).recommended)||[]).length+'건 — 제작대상만·토픽당 최대 3건. '
            +'배지 숫자가 점수, 마우스를 올리면 근거가 나옵니다. <b>점수는 160건을 10건으로 줄이는 도구이지 정답이 아닙니다</b> — 최종 판단은 육안입니다.')
                            :'정렬: '+({topic:'토픽순(기본)',views:'조회순'}[kwSort]||'')}
       </span><span class="kwnote" style="margin-left:auto">발행 ${dt((DATA.keywords||{}).generated_at)}</span></div>`
    + `<div class="kwtoolbar">
         <button class="primary" id="kwCopyBtn">✅ 승인분 복사</button>
         <button id="kwClearBtn">전체 해제</button>
         <span class="kwcount">체크 <b id="kwPickCount">${Object.keys(kwPicked).length}</b>건</span>
         <span class="kwsort">
           <button class="kwchip${kw12hOnly?' on':''}" data-kwflag="12h" title="게시 상대표기 기준 12시간 이내(근사)만 본다">12시간 이내만</button>
           <button class="kwchip${kwUncheckedOnly?' on':''}" data-kwflag="unchecked" title="아직 체크하지 않은 항목만 본다">미체크만</button>
         </span>
       </div>`;
  const cards = shown.map(k=>{
    const url=/^https?:/.test(k.url||'')?k.url:'';
    const thumb=k.thumbnail?`<img src="${esc(k.thumbnail)}" alt="" loading="lazy">`:'';
    const cls = k.verdict==='후보'?' cand':(k.verdict==='보류'?' hold':'');
    const badge = (typeof k.score==='number')
      ? `<span class="kwscore${cls}" title="${esc(k.verdict||'')} · ${esc(k.why||'')}">${k.score}</span>` : '';
    const pickedOn = kwPicked[k.video_id];                       // 체크한 날짜(YYYY-MM-DD) 또는 undefined
    const stale = pickedOn && pickedOn!==todayStr();              // 오늘이 아닌 날 체크됨 → '어제' 배지(삭제 아님)
    return `<div class="kwcard">${badge}
      <input type="checkbox" class="kwpick" data-vid="${esc(k.video_id||'')}" title="승인 체크"
             ${pickedOn?'checked':''}>
      ${stale?'<span class="kwtag" style="position:absolute;top:26px;right:6px;z-index:2;background:var(--panel)">어제</span>':''}
      ${url?`<a href="${esc(url)}" target="_blank" rel="noopener">${thumb}</a>`:thumb}
      <div class="kwbody">
        ${url?`<a class="kwtitle" href="${esc(url)}" target="_blank" rel="noopener">${esc(k.title)}</a>`
             :`<span class="kwtitle">${esc(k.title)}</span>`}
        <div class="kwmeta"><span>${esc(k.channel||'')}</span><span>·</span>
          <span class="mono">조회수 ${nfmt(k.view_count)}</span></div>
        <div class="kwmeta"><span class="kwtag">${esc(k.topic_name||k.topic)}</span>
          <span class="kwtag">${esc(k.suffix||'')}</span>
          ${k.produce_target?'':'<span class="kwtag">관측</span>'}</div>
      </div></div>`;
  }).join('');
  return `<div class="card">${bar}<div class="kwgrid">${cards}</div></div>`;
}

function wireKeywords(){
  document.querySelectorAll('[data-kw]').forEach(b=>{
    b.onclick=()=>{ kwTopic=b.dataset.kw; render(); };
  });
  document.querySelectorAll('[data-kwsort]').forEach(b=>{
    b.onclick=()=>{ kwSort=b.dataset.kwsort; render(); };   // 토픽 필터는 유지된다
  });
  document.querySelectorAll('[data-kwflag]').forEach(b=>{
    b.onclick=()=>{
      if(b.dataset.kwflag==='12h') kw12hOnly=!kw12hOnly; else kwUncheckedOnly=!kwUncheckedOnly;
      render();
    };
  });
  document.querySelectorAll('.kwpick').forEach(cb=>{
    cb.onclick=e=>e.stopPropagation();   // 카드 클릭(링크 이동)으로 안 새게 막는다
    cb.onchange=()=>{
      const vid=cb.dataset.vid; if(!vid) return;
      if(cb.checked) kwPicked[vid]=todayStr(); else delete kwPicked[vid];
      savePicked();
      const c=$('#kwPickCount'); if(c) c.textContent=Object.keys(kwPicked).length;   // 전체 재렌더 없이 개수만 갱신
      if(kwUncheckedOnly) render();   // 미체크만 필터 중이면 방금 체크한 카드가 사라져야 한다
    };
  });
  const clearBtn=$('#kwClearBtn');
  // ★사용자가 명시적으로 누를 때만 지운다 — 자동 삭제는 어디에도 없다(2026-08-29 지시)
  if(clearBtn) clearBtn.onclick=()=>{ kwPicked={}; savePicked(); render(); };
  const copyBtn=$('#kwCopyBtn');
  if(copyBtn) copyBtn.onclick=()=>{
    const kw=(DATA.keywords||{}).items||[];
    const rows=kw.filter(k=>k.video_id in kwPicked);
    const text=rows.map(k=>`[${k.topic_name||k.topic}] ${k.title} | ${k.published_at||''} | ${k.url||''} | ${k.video_id||''}`).join('\n');
    if(!rows.length){ copyBtn.textContent='선택된 항목 없음'; setTimeout(()=>copyBtn.textContent='✅ 승인분 복사',1500); return; }
    const done=()=>{ const o=copyBtn.textContent; copyBtn.textContent=`복사됨! (${rows.length}건)`;
      setTimeout(()=>copyBtn.textContent=o,1500); };
    const fallback=()=>{
      const ta=document.createElement('textarea');
      ta.value=text; ta.style.position='fixed'; ta.style.opacity='0';
      document.body.appendChild(ta); ta.focus(); ta.select();
      try{ document.execCommand('copy'); done(); }
      catch(e){ copyBtn.textContent='복사 실패 — 수동 선택 필요'; setTimeout(()=>copyBtn.textContent='✅ 승인분 복사',2000); }
      document.body.removeChild(ta);
    };
    if(navigator.clipboard && navigator.clipboard.writeText){
      navigator.clipboard.writeText(text).then(done).catch(fallback);
    } else fallback();
  };
}

function vItems(){
  const kwHtml=vKeywords();
  const its=(DATA.items||{}).items||[];
  if(!its.length) return kwHtml || '<div class="card muted">수집물이 없습니다.</div>';
  if(kwHtml) return kwHtml + vItemsLegacy(its);
  return vItemsLegacy(its);
}

// 기존 refined 수집물 렌더(충돌 없이 아래에 이어 붙는다)

    <h3>${esc((i.title||'').trim())}</h3>
    <div class="muted" style="font-size:12px">${esc(i.kind||'')} · ${ago(i.collected)}${i.importance?' · 중요도 '+esc(i.importance):''}
      ${i.url&&/^https?:/.test(i.url)?` · <a href="${esc(i.url)}" target="_blank" rel="noopener">원문↗</a>`:''}</div>
    <p style="margin:6px 0">${esc(i.summary)}</p>
    <div>${(i.tags||[]).map(t=>`<span class="tag">${esc(t)}</span>`).join('')}</div>
  </div>`).join('')}</div>`;
}
function vHealth(){
  const h=DATA.health||{}; if(h.error) return '<div class="card bad">건강 데이터 오류: '+esc(h.error)+'</div>';
  const st=h.stats||{}, src=h.sources||{}, dk=h.disk_mb||{}, al=h.drop_alerts||[];
  return `<div class="grid">
    ${kpi((st.success_rate??'-')+'%','성공률(최근'+(st.runs||0)+')')}
    ${kpi((st.avg_sec??'-')+'s','평균 소요')}
    ${kpi(al.length,'급감 경보')}
    ${kpi(Object.values(dk).reduce((a,b)=>a+b,0).toFixed(1)+'MB','저장 사용량')}
  </div>
  <div class="card"><b>소스별 수집량</b><table class="mono">${
    Object.entries(src).map(([k,v])=>`<tr><th>${esc(k)}</th><td>${esc(v)}건</td></tr>`).join('')||'<tr><td class="muted">-</td></tr>'
  }</table></div>
  ${al.length?`<div class="card bad"><b>⚠ 급감 경보</b><ul>${al.map(a=>`<li>${esc(JSON.stringify(a))}</li>`).join('')}</ul></div>`:''}
  <div class="card"><b>디스크(MB)</b><table class="mono">${
    Object.entries(dk).map(([k,v])=>`<tr><th>${esc(k)}</th><td>${esc(v)}</td></tr>`).join('')
  }</table></div>`;
}

// ---- 명령 전송(Contents API 파일 큐) ----
function newId(){ return Date.now().toString(36)+'-'+Math.random().toString(36).slice(2,7); }
async function ghPut(path,obj,msg){
  if(!cfg.pat) throw new Error('PAT 미설정');
  const url=`https://api.github.com/repos/${cfg.repo}/contents/${path}`;
  const body={ message:msg, branch:cfg.branch,
    content: btoa(unescape(encodeURIComponent(JSON.stringify(obj,null,2)))) };
  const r=await fetch(url,{method:'PUT',headers:{
    'Authorization':'Bearer '+cfg.pat,'Accept':'application/vnd.github+json'},body:JSON.stringify(body)});
  if(!r.ok){ const t=await r.text(); throw new Error('GitHub '+r.status+': '+t.slice(0,120)); }
  return r.json();
}
async function sendCommand(cmd,args,isWrite,reqId){
  try{
    const id=reqId||newId();
    const payload={ id, command:cmd, args:args||{}, write:!!isWrite, requested_at:Math.floor(Date.now()/1000),
                    requested_by:'console' };
    await ghPut(`commands/pending/${id}.json`, payload, `cmd: ${cmd} 요청`);
    toast(`요청 전송됨: ${cmd} (${id.slice(0,8)}) — 폴러 처리 대기`);
    return id;
  }catch(e){ toast('전송 실패: '+e.message, true); }
}
// 쓰기 명령: 2단계(요청→확인 파일 별도). 폴러가 둘 다 있어야 실행.
let pendingWrite=null;
function confirmWrite(cmd,args){
  if(!cfg.pat){ toast('PAT를 먼저 설정하세요.', true); return; }
  pendingWrite={cmd,args};
  $('#mTitle').textContent='⚠ 실행 명령 확인';
  $('#mBody').innerHTML=`<b>${esc(cmd)}</b> ${esc(JSON.stringify(args))}<br>이 명령은 로컬 GPU 파이프라인을 실제로 실행합니다. 확인을 전송하면 폴러가 락 확인 후 1회 실행합니다.`;
  $('#modal').classList.add('on');
}
$('#mNo').onclick=()=>{ $('#modal').classList.remove('on'); pendingWrite=null; };
$('#mYes').onclick=async ()=>{
  const w=pendingWrite; $('#modal').classList.remove('on'); pendingWrite=null; if(!w) return;
  const id=await sendCommand(w.cmd,w.args,true);
  if(id){ // 확인 파일(별도) — 폴러가 요청+확인 둘 다 & 10분내 & id일치일 때만 실행
    try{ await ghPut(`commands/confirm/${id}.json`,{id,confirmed_at:Math.floor(Date.now()/1000)},`confirm: ${w.cmd}`);
      toast('확인 전송 완료 — 폴러 실행 대기'); }
    catch(e){ toast('확인 전송 실패: '+e.message,true); }
  }
};

function toast(msg,bad){ const p=$('#statusPill'); const o=p.textContent,oc=p.className;
  p.textContent=msg; p.className='pill '+(bad?'bad':'ok');
  setTimeout(()=>loadAll(),1500); }
